# Gatework: spec-driven work from a ticket to a reviewed PR, through approval gates. brainrc's
# default pack: brainrc-gatework (the engine), its roles, ticket connectors and the domain skills.
# brainrc fetches it from github.com/brainrc/gatework at the tag its packs.toml pins.
name = "gatework"
prefix = "brainrc-"
id = "brainrc/gatework"
description = "spec-driven work from a ticket to a reviewed PR"
requires_core = ">=0.7, <0.8"
max_always_tokens = 3000
validator = "validator.py"  # its own checks and the extensions.md render (brainrc's docs/packs.md)
